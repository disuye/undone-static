	     by the D's outer curve; below it, by the O's outer curve. Each edge hands over at the
	     crossing with a vertical tangent (D inner → O outer, D outer → O inner). The crescents left
	     over belong to the second pass, which is last over this area so needs no limit. -->
	<clipPath id="x1"><path d="M655.587,650 H702.7 V672.97 A47.48,48.256 0 0 1 712.99,690 C714.64,694.72 716.875,700.19 716.875,706.19 V707.2 H655.587 Z
