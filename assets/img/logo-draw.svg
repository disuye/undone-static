	<!-- One region per letter part. Edges sit exactly on the next part where the two are joined
	     (solid ink both sides), and pull back ~1 unit where they'd run alongside the logo's own
	     outline, so no edge pixel is inked early. Left edges overlap the previous (already drawn)
	     region by 1 unit to hide AA seams.
	     WebKit (Safari) mis-clips strokes when a clipPath holds <rect>/<ellipse> or several shapes:
	     keep every clip below as a single <polygon> or <path>. -->
	<clipPath id="u"><polygon points="495,650 585.107,650 585.107,698 595,710.6 595,765 495,765"/></clipPath>
	<clipPath id="n1"><polygon points="584.107,650 630.1,650 630.1,715.643 656.587,749.62 656.587,765 584.107,765"/></clipPath>
