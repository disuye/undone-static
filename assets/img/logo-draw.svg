<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="501.011 655.249 440.869 101.977" role="img" aria-label="Undone">
	<style>
		/* Pen speed in path units per second; --at / --len are distances along the pen route.
		   --v, --pre, 1247 and gesture 2's --at:777 are mirrored as --logo-* in style.css: change both together. */
		:root { --v: 840; --pre: 500ms; --end: calc(1247 * 1s / var(--v) + var(--pre)); }

		.ink {
			fill: none;
			stroke: #000;
			stroke-width: 30;
			stroke-dasharray: 1 2;
			stroke-dashoffset: 1.01;
			animation: draw calc(var(--len) * var(--k, 1) * 1s / var(--v)) var(--ease, linear) calc(var(--at) * 1s / var(--v) + var(--pre)) forwards;
		}
		.in  { --k: 1.5; --ease: cubic-bezier(.5, 0, .8, .7); }
		.out { --k: 1.5; --ease: cubic-bezier(.2, .3, .5, 1); }

		@keyframes draw { to { stroke-dashoffset: 0; } }

		/* At rest, swap the strokes for the original outline so the final frame is pixel-identical */
		.strokes { animation: hide 0s var(--end) forwards; }
		.solid { visibility: hidden; animation: show 0s var(--end) forwards; }
		@keyframes hide { to { visibility: hidden; } }
		@keyframes show { to { visibility: visible; } }

		@media (prefers-reduced-motion: reduce) {
			.ink, .strokes, .solid { animation: none; }
			.strokes { visibility: hidden; }
			.solid { visibility: visible; }
		}
	</style>

